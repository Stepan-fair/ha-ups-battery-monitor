path: ibp
sections:
- type: grid
  cards:
  - type: heading
    heading: ИБП · запас автономности
    icon: mdi:battery-heart
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.ups_soc
      state_not: unavailable
    - condition: state
      entity: sensor.ups_soc
      state_not: unknown
    card:
      type: gauge
      entity: sensor.ups_soc
      name: Расчётный заряд АКБ
      min: 0
      max: 100
      severity:
        red: 0
        yellow: 25
        green: 60
  - type: markdown
    content: '{% set seconds = states(''sensor.ups_time_remaining'') | float(none) %} ## {% if seconds is none %}Время
      пока неизвестно{% else %}{{ ''%02d:%02d'' | format((seconds // 3600) | int, ((seconds % 3600) // 60) | int)
      }}{% endif %}

      {% set context = state_attr(''sensor.ups_time_remaining'', ''context'') or '''' %} {% if context.startswith(''discharging'')
      %}Работа от АКБ{% elif context.startswith(''complete_load'') %}Если сеть пропадёт сейчас · по полной нагрузке{%
      elif context.startswith(''last_discharge_load'') %}Если сеть пропадёт сейчас · по последнему разряду{% else
      %}Для прогноза нужна подтверждённая полная нагрузка{% endif %} {% if ''to_reserve'' in context %} · до рабочего
      резерва{% endif %}

      {% set end = states(''sensor.ups_expected_empty_at'') %} {% if end not in [''unknown'',''unavailable'',''none'']
      %}Ожидаемое окончание: **{{ as_local(as_datetime(end)).strftime(''%d.%m.%Y %H:%M'') }}**{% endif %}'
  - type: entities
    title: Заряд и доступный запас
    show_header_toggle: false
    entities:
    - sensor.ups_battery_mode
    - binary_sensor.ups_on_battery
    - sensor.ups_usable_soc
    - sensor.ups_remaining_ah
    - sensor.ups_remaining_wh
    - sensor.ups_time_to_full
  - type: markdown
    content: '**{{ {''restore_error'':''Ошибка восстановления'',''storage_error'':''Ошибка сохранения'',''limited_meter'':''Ограничено
      измерителем'',''unavailable'':''Данные недоступны'',''no_initial_anchor'':''Нет начальной точки'',''capacity_conflict'':''Расхождение
      оценок ёмкости'',''data_gap'':''Есть пропуск данных'',''nominal'':''Предварительно по номиналу'',''manual_estimate'':''Предварительно
      по ручной точке'',''observed'':''Подтверждено наблюдениями''}.get(states(''sensor.ups_data_quality''),''Ожидание
      показаний'') }}**

      {% set issues = state_attr(''sensor.ups_data_quality'',''issues'') or [] %} {% if ''range'' in issues %}Ток
      приблизился к пределу измерителя. Этот участок не обучает ёмкость.{% endif %} {% if ''no_initial_anchor''
      in issues %}Укажите известный заряд в настройках или дождитесь подтверждённого полного заряда. 100% автоматически
      при запуске не задаётся.{% endif %} {% if ''temperature_uncompensated'' in issues %}Температура отличается
      от условий определения ёмкости. Поправка не подтверждена.{% endif %} {% if ''preliminary'' in issues %}Прогноз
      нового режима предварительный.{% endif %} {% if ''model_mismatch'' in issues %}Баланс заряда вышел за границы
      модели. Требуется проверка начальной точки и измерителя.{% endif %}

      {% set last = states(''sensor.ups_last_sample_at'') %} Последнее исправное измерение: {% if last not in [''unknown'',''unavailable'',''none'']
      %}{{ as_local(as_datetime(last)).strftime(''%d.%m.%Y %H:%M:%S'') }}{% else %}ещё нет{% endif %}'
- type: grid
  cards:
  - type: heading
    heading: Ёмкость и условия
    icon: mdi:battery-check
  - type: entities
    show_header_toggle: false
    entities:
    - sensor.ups_capacity_ah
    - sensor.ups_health
    - sensor.ups_voltage
    - sensor.ups_current
    - sensor.ups_temperature
    - sensor.ups_humidity
    - sensor.ups_bms_soc
  - type: markdown
    content: 'Батарея: **{{ state_attr(''sensor.ups_capacity_ah'',''battery_name'') or ''АКБ'' }}**. {% if state_attr(''sensor.ups_capacity_ah'',''origin'')
      == ''nominal'' %}Ёмкость предварительная, по заявленному номиналу.{% else %}Рабочая ёмкость определена по
      наблюдениям; условия — в подробностях сенсора.{% endif %}

      Здоровье показывает сохранение ёмкости только при сопоставимых условиях. {% if state_attr(''sensor.ups_temperature'',''ambient'')
      %}Используется температура помещения.{% endif %} Влажность показана как условие эксплуатации и не меняет расчёт
      ёмкости.'
  - type: button
    name: Настройки АКБ и ИБП
    icon: mdi:cog-outline
    tap_action:
      action: navigate
      navigation_path: /config/integrations/integration/ups
- type: grid
  cards:
  - type: heading
    heading: Сессии и накопленные потоки
    icon: mdi:history
  - type: entities
    title: Текущие и последние сессии
    show_header_toggle: false
    entities:
    - sensor.ups_charge_started_at
    - sensor.ups_charge_duration
    - sensor.ups_last_charge_ended_at
    - sensor.ups_last_charge_duration
    - sensor.ups_discharge_started_at
    - sensor.ups_discharge_duration
    - sensor.ups_last_discharge_ended_at
    - sensor.ups_last_discharge_duration
  - type: entities
    title: За всё время · не сбрасывается при замене АКБ
    show_header_toggle: false
    entities:
    - sensor.ups_charge_ah_total
    - sensor.ups_discharge_ah_total
    - sensor.ups_charge_wh_total
    - sensor.ups_discharge_wh_total
  - type: logbook
    title: Заряды, разряды и восстановление
    hours_to_show: 168
    entities:
    - sensor.ups_battery_mode
- type: grid
  cards:
  - type: heading
    heading: Графики АКБ
    icon: mdi:chart-line
  - type: history-graph
    title: Заряд и доступный запас
    hours_to_show: 24
    entities:
    - sensor.ups_soc
    - sensor.ups_usable_soc
  - type: history-graph
    title: Ток и напряжение · выбранный источник
    hours_to_show: 24
    entities:
    - sensor.ups_current
    - sensor.ups_voltage
  - type: history-graph
    title: Температура и влажность
    hours_to_show: 24
    entities:
    - sensor.ups_temperature
    - sensor.ups_humidity
- type: grid
  cards:
  - type: heading
    heading: Достоверность и проверка прогноза
    icon: mdi:check-decagram
  - type: entities
    show_header_toggle: false
    entities:
    - sensor.ups_forecast_status
    - sensor.ups_calibration_status
    - sensor.ups_time_to_cutoff
    - sensor.ups_time_cutoff_lower
    - sensor.ups_time_cutoff_upper
    - sensor.ups_verified_cycles
    - sensor.ups_prediction_error
  - type: markdown
    content: '{% set reasons = state_attr(''sensor.ups_forecast_status'',''reasons'') or [] %}

      {% set names = {''no_initial_anchor'':''Нужна начальная точка заряда.'',''nominal_estimate'':''Ёмкость пока
      взята из номинала.'',''manual_estimate'':''Начальный заряд задан приблизительно вручную.'',''meter_unverified'':''Измеритель
      ещё не проверен мастером калибровки.'',''forecast_unvalidated'':''Ещё нет трёх сопоставимых разрядов с наблюдаемой
      отсечкой.'',''calibration_due'':''Опорная точка заряда устарела.'',''load_expired'':''Последняя нагрузка устарела
      — нужен новый замер.'',''data_gap'':''Есть пропуски измерений.'',''range'':''Превышен диапазон измерителя.'',''ambient_temperature'':''Температура
      взята по помещению.'',''temperature_unknown'':''Температура неизвестна.'',''temperature_uncompensated'':''Поправка
      на текущую температуру не подтверждена.'',''charge_blocked'':''BMS запрещает заряд.'',''discharge_blocked'':''BMS
      запрещает разряд.'',''battery_fault'':''Есть неисправность АКБ.'',''bms_protection'':''BMS сообщает о защите.'',''capacity_conflict'':''Оценки
      ёмкости расходятся.'',''cutoff_unconfigured'':''Порог рабочего отключения не настроен.'',''storage_error'':''Не
      удаётся сохранить расчёт.'',''restore_error'':''Не удалось восстановить состояние.'',''stale'':''Показания
      измерителя устарели.'',''invalid'':''Показания измерителя недоступны.'',''model_mismatch'':''Баланс заряда
      вышел за границы модели.'',''preliminary'':''Новый режим ещё уточняется.''} %}

      {% for r in reasons %}{% if r in names %}• {{ names[r] }}

      {% endif %}{% endfor %}

      Диапазон до отключения строится по ошибкам сопоставимых наблюдений. Он не гарантирует время будущей работы.
      Процент вероятности не назначается.

      '
  - type: entities
    title: Калибровка и актуальность нагрузки
    show_header_toggle: false
    entities:
    - sensor.ups_last_calibration_at
    - sensor.ups_calibration_age
    - sensor.ups_meter_checked_at
    - sensor.ups_last_load_at
    - sensor.ups_load_age
    - sensor.ups_termination_status
- type: grid
  cards:
  - type: heading
    heading: Паспорт текущей батареи
    icon: mdi:battery-heart-variant
  - type: entities
    show_header_toggle: false
    entities:
    - sensor.ups_equivalent_cycles
    - sensor.ups_battery_charge_ah
    - sensor.ups_battery_discharge_ah
    - sensor.ups_battery_discharge_wh
    - sensor.ups_full_count
    - sensor.ups_last_full_at
    - sensor.ups_min_voltage
    - sensor.ups_max_charge_current
    - sensor.ups_max_discharge_current
  - type: markdown
    content: 'Эквивалентные циклы считаются по отданным А·ч относительно настроенного номинала с начала наблюдения
      этой АКБ. Два расхода по 50% дают примерно один цикл. При замене батареи паспорт архивируется отдельно.

      {% set passport = state_attr(''sensor.ups_equivalent_cycles'',''passport'') or {} %}

      {% if passport.get(''history_partial'') %}История до обновления неполная: старые экстремумы и полные заряды
      не восстанавливаются задним числом.{% endif %}

      {% set history = state_attr(''sensor.ups_capacity_ah'',''history'') or [] %}

      {% if history %}**Последние оценки рабочей ёмкости:**

      {% for item in history %}

      • {{ as_local(as_datetime(item.observed_at)).strftime(''%d.%m.%Y %H:%M'') }}: {{ item.ah | round(2) }} А·ч
      · {{ item.reference_temperature_c | round(1) }} °C · {{ item.reference_current_a | round(2) }} А · отсечка
      {{ item.cutoff_v }} В

      {% endfor %}{% else %}Измерений рабочей ёмкости пока нет.{% endif %}'
  - type: entities
    title: Диагностика BMS · после подключения датчиков
    show_header_toggle: false
    entities:
    - sensor.ups_charge_status
    - sensor.ups_bms_protection
    - sensor.ups_cell_min
    - sensor.ups_cell_max
    - sensor.ups_cell_delta
    - sensor.ups_bms_link_quality
    - sensor.ups_bms_soc_difference
  - type: markdown
    content: Пустые показатели BMS означают, что соответствующий источник ещё не подключён или недоступен. Показания
      BMS не усредняются с расчётным зарядом. Температура самой батареи, если доступна, имеет приоритет над комнатной.
